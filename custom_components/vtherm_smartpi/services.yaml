reset_smartpi_learning:
  name: Reset SmartPI learning
  description: Reset the SmartPI learning state for a thermostat.
  target:
    entity:
      integration: versatile_thermostat
      domain: climate

set_smartpi_learning:
  name: Set SmartPI learning
  description: Enable or pause SmartPI thermal learning for a thermostat.
  target:
    entity:
      integration: versatile_thermostat
      domain: climate
  fields:
    learning_enabled:
      name: Learning enabled
      description: Whether SmartPI may update its thermal model and dead-time estimates.
      required: true
      selector:
        boolean:

force_smartpi_calibration:
  name: Force SmartPI calibration
  description: Start a SmartPI calibration for a thermostat (up to three measurement pulses near the setpoint, once the first model is published); the learned model is corrected where the measure differs from it by more than 30 %. Safe to call from an automation; a request is refused while learning the first model, while learning is paused, while the thermostat is off or within 24 hours of the last calibration, and ignored while one is running.
  target:
    entity:
      integration: versatile_thermostat
      domain: climate

reset_smartpi_integral:
  name: Reset SmartPI integral
  description: Reset the SmartPI integral accumulator for a thermostat.
  target:
    entity:
      integration: versatile_thermostat
      domain: climate
